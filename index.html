<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>亲戚称呼 · Family Kinship</title>
<style>
:root{
  --bg:#e9eef0; --panel:#fff; --ink:#10202c; --muted:#44555f; --line:#9fb0bb;
  --a:#1d4ed8; --a-soft:#dbe6ff; --b:#c2410c; --b-soft:#ffe4d3;
  --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
header{padding:8px 12px 10px;background:var(--panel);border-bottom:2px solid var(--ink);z-index:5}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.top b{font:700 18px var(--serif)}
#logout{min-height:36px;padding:0 12px;border:2px solid var(--ink);border-radius:18px;background:#fff;font:600 13px var(--sans);color:var(--ink);cursor:pointer}
#clear{min-height:40px;padding:0 14px;border:2px solid var(--ink);border-radius:12px;background:#fff;font:700 15px var(--sans);color:var(--ink);cursor:pointer}
.pick{display:flex;gap:8px}
.pick button{flex:1;min-height:56px;border:2px solid var(--ink);background:#fff;border-radius:12px;font:700 18px var(--serif);color:var(--ink);text-align:left;padding:6px 10px;cursor:pointer}
.pick button small{display:block;font:400 13px var(--sans);color:var(--muted)}
.pick button[data-role=A].on{background:var(--a-soft);border-color:var(--a);box-shadow:0 0 0 2px var(--a)}
.pick button[data-role=B].on{background:var(--b-soft);border-color:var(--b);box-shadow:0 0 0 2px var(--b)}
#banner{margin-top:8px;padding:10px 12px;border-radius:12px;background:var(--ink);color:#fff;line-height:1.5;min-height:68px;font-size:16px}
#banner .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
#banner .t{font:700 28px var(--serif)}
#banner .chain{font-size:13px;opacity:.75;margin-top:2px}
#banner .err{color:#ffd2b8}
#viewport{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none;cursor:grab;background:#fff}
#viewport.drag{cursor:grabbing}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
#lines{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.card{position:absolute;width:220px;height:126px;background:#fff;border:3px solid #66717a;border-radius:18px;
  box-shadow:0 3px 10px rgba(16,32,44,.2);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;padding:16px 18px 12px;cursor:pointer;user-select:none;-webkit-user-select:none}
.card.male{background:#e1efff;border-color:#427bb5}
.card.female{background:#ffe6ee;border-color:#bd6682}
.card .n{width:100%;text-align:center;font:700 21px/1.2 var(--serif);overflow-wrap:anywhere;}
.card .y{font-size:16px;color:#344957}
.card .role{position:absolute;left:8px;bottom:7px;font:600 11px/1.1 var(--sans);color:#60427d;background:#f3eaff;border:1px solid #c7a9e6;border-radius:8px;padding:2px 5px}
.card .g{position:absolute;top:5px;right:9px;font-size:16px;color:#263a4a}
.card.A{border-color:var(--a);box-shadow:0 0 0 4px var(--a),0 3px 10px rgba(16,32,44,.2)}
.card.B{border-color:var(--b);box-shadow:0 0 0 4px var(--b),0 3px 10px rgba(16,32,44,.2)}
.card .tag{position:absolute;left:-3px;top:-14px;font:700 13px var(--sans);color:#fff;padding:1px 9px;border-radius:9px}
.card.A .tag{background:var(--a)}.card.B .tag{background:var(--b)}
#zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:8px}
#zoom button{width:48px;height:48px;border-radius:12px;border:2px solid var(--ink);background:#fff;font:700 22px var(--sans);cursor:pointer;box-shadow:0 2px 6px rgba(16,32,44,.2)}
#tree-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
#tree-actions button{min-height:44px;padding:6px 14px;border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);font:600 15px var(--sans);cursor:pointer}
#tree-actions button:hover{background:#edf3f6}
#status{position:absolute;left:10px;bottom:10px;font-size:13px;color:var(--muted);background:#ffffffe0;padding:2px 8px;border-radius:8px}
#gate{position:fixed;inset:0;background:rgba(16,32,44,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
#gate.show{display:flex}
#gate form{background:#fff;border-radius:16px;padding:22px;width:100%;max-width:380px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#gate h2{margin:0 0 4px;font:700 22px var(--serif)}
#gate p{margin:0 0 14px;color:var(--muted)}
#gate input{width:100%;min-height:52px;font:600 20px var(--sans);padding:0 12px;border:2px solid var(--ink);border-radius:10px}
#gate button{width:100%;min-height:52px;margin-top:12px;border:0;border-radius:10px;background:var(--a);color:#fff;font:700 18px var(--sans);cursor:pointer}
#gate button:disabled{opacity:.6}
#gate .msg{margin-top:10px;color:#b42318;font-weight:600;min-height:20px}
@media(max-width:600px){
  header{padding:8px 9px}
  .top{gap:8px}.top b{font-size:16px}#logout{min-height:42px;padding:0 9px;font-size:12px}
  .pick{gap:6px}.pick button{min-height:62px;font-size:17px;padding:6px 8px}.pick button small{font-size:12px}
  #clear{width:100%;min-height:46px;margin-top:7px;font-size:16px}
  #tree-actions{display:grid;grid-template-columns:1fr 1fr}
  #tree-actions button{min-height:46px;padding:6px 8px;font-size:14px}
  #banner{font-size:15px;min-height:64px;padding:8px 10px}#banner .t{font-size:23px}
  #zoom{right:8px;bottom:8px;gap:7px}#zoom button{width:50px;height:50px}
  #status{max-width:calc(100% - 72px);font-size:12px}
}
@media (orientation:landscape) and (max-height:520px){
  html{height:100%;min-height:100%;overflow-y:auto}
  body{height:auto;min-height:100%;overflow:visible}
  header{flex:none}
  #viewport{flex:none;height:70vh;height:70dvh;min-height:240px;touch-action:pan-y}
}
</style>
</head>
<body>
<header>
  <div class="top"><b>亲戚称呼 Family Kinship</b><button id="logout">Change Passcode / 退出</button></div>
  <div class="pick">
    <button data-role="A" class="on"><small>Person A · 我 (Me)</small><span id="nameA">Tap a card</span></button>
    <button data-role="B"><small>Person B · 亲戚 (Relative)</small><span id="nameB">Tap a card</span></button>
  </div>
  <button id="clear" type="button">Clear selections / 清除选择</button>
  <div id="tree-actions">
    <button id="focus-tree" type="button">Focus Person A's family / 聚焦所选家族</button>
    <button id="show-tree" type="button">Show whole family / 显示完整家谱</button>
  </div>
  <div id="banner"></div>
</header>
<div id="viewport">
  <div id="stage"><svg id="lines"></svg></div>
  <div id="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" aria-label="Fit to screen">⤢</button></div>
  <div id="status"></div>
</div>

<div id="gate" role="dialog" aria-modal="true" aria-labelledby="gtitle">
  <form id="gform">
    <h2 id="gtitle">Family login / 家族登录</h2>
    <p>Enter the family name and passcode. / 输入家族名称和密码。</p>
    <label for="gfamily">Family name / 家族名称</label>
    <input id="gfamily" type="text" autocomplete="username" aria-label="Family name" required>
    <label for="gkey">Passcode / 密码</label>
    <input id="gkey" type="password" autocomplete="current-password" aria-label="Passcode" required>
    <button id="gbtn" type="submit">Enter / 进入</button>
    <div class="msg" id="gmsg" role="alert"></div>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/relationship.js/dist/relationship.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/elkjs/lib/elk.bundled.js"></script>
<script>
/* ---------- CONFIG ---------- */
const FAMILY_API_URLS = {
  chong: "https://script.google.com/macros/s/AKfycbzyD2y2MyeEyfJVcwB5MSyh0ktVdWF0nCXgKtN8pm3hPOCM01fDADU7ps_gEdqBfnsW4g/exec",
  sio: "https://script.google.com/macros/s/AKfycbzB9vNol-nr50K8VETwJ9cM--7r0458sjVLHwSjcLNc3tQV2AdXcwwUwPepPz-WvKwk/exec"
};
// Sio's source sheet uses a placeholder for the same ancestor identified by
// the family as Sio Chip / 苏式习. Merge that placeholder into the real card.
const FAMILY_DATA_REPAIRS = {
  sio: {
    replaceId: {from: "SIO-P010", to: "SIO-001"},
    rename: {id: "SIO-001", name: "Sio Chip (苏式习)"},
    parentFixes: {
      "SIO-182": {Father_ID: "SIO-179"},
      "SIO-183": {Father_ID: "SIO-179"}
    }
  }
};
const FAMILY_PARAM = new URLSearchParams(location.search).get("family") || "";
const FAMILY_CODES = new Set(Object.keys(FAMILY_API_URLS));
const familyStorageKey = family => `kinship_passkey_${family.trim().toLowerCase()}`;
const DEMO = Object.values(FAMILY_API_URLS).every(url => !url); // no family endpoint configured → demo data

const MOCK_ROWS = [
  {ID:"1", Name:"王建国", Gender:"M", Father_ID:null, Mother_ID:null, Spouse_ID:"2", Birth_Year:1940, Sibling_Rank:1},
  {ID:"2", Name:"李美华", Gender:"F", Father_ID:null, Mother_ID:null, Spouse_ID:"1", Birth_Year:1943, Sibling_Rank:1},
  {ID:"3", Name:"王大伟", Gender:"M", Father_ID:"1", Mother_ID:"2", Spouse_ID:"4", Birth_Year:1968, Sibling_Rank:1},
  {ID:"4", Name:"陈丽娟", Gender:"F", Father_ID:null, Mother_ID:null, Spouse_ID:"3", Birth_Year:1970, Sibling_Rank:1},
  {ID:"5", Name:"王晓明", Gender:"M", Father_ID:"3", Mother_ID:"4", Spouse_ID:null, Birth_Year:1995, Sibling_Rank:1},
  {ID:"6", Name:"王小雨", Gender:"F", Father_ID:"3", Mother_ID:"4", Spouse_ID:null, Birth_Year:1998, Sibling_Rank:2}
];

/* ---------- DATA ---------- */
const sid = v => (v === undefined || v === null || String(v).trim() === "") ? null : String(v).trim();

function normalize(rows, familyCode = ""){
  const repair = FAMILY_DATA_REPAIRS[familyCode];
  const sourceRows = rows.map(r => {
    const row = {...r};
    if (repair) {
      ["Father_ID", "Mother_ID", "Spouse_ID"].forEach(field => {
        if (sid(row[field]) === repair.replaceId.from) row[field] = repair.replaceId.to;
      });
      const parentFix = repair.parentFixes && repair.parentFixes[sid(row.ID)];
      if (parentFix) Object.assign(row, parentFix);
      if (sid(row.ID) === repair.rename.id) row.Name = repair.rename.name;
    }
    return row;
  }).filter(row => !repair || sid(row.ID) !== repair.replaceId.from);
  const people = sourceRows.map(r => ({
    id: sid(r.ID), name: sid(r.Name),
    placeholder: /\(parent details not in source\)/i.test(sid(r.Name) || ""),
    gender: /^(f|female|女)/i.test(sid(r.Gender)||"") ? "F" : /^(m|male|男)/i.test(sid(r.Gender)||"") ? "M" : null,
    father: sid(r.Father_ID), mother: sid(r.Mother_ID), spouse: sid(r.Spouse_ID),
    birth: Number(sid(r.Birth_Year)) || 0,
    rank: sid(r.Sibling_Rank) === null ? null : Number(sid(r.Sibling_Rank))
  })).filter(p => p.id && p.name);
  const byId = Object.fromEntries(people.map(p => [p.id, p]));
  people.forEach(p => { if (p.spouse && byId[p.spouse] && !byId[p.spouse].spouse) byId[p.spouse].spouse = p.id; });
  // Repair a common sheet-entry mistake: a person listed as their own parent.
  // When the other recorded parent has a spouse, that spouse is the safest
  // replacement for the self-reference (and keeps the family branch linked).
  people.forEach(p => {
    if (p.father === p.id) {
      p.father = null;
      const otherParent = byId[p.mother];
      const inferred = otherParent && byId[otherParent.spouse];
      if (inferred && inferred.id !== p.id) p.father = inferred.id;
    }
    if (p.mother === p.id) {
      p.mother = null;
      const otherParent = byId[p.father];
      const inferred = otherParent && byId[otherParent.spouse];
      if (inferred && inferred.id !== p.id) p.mother = inferred.id;
    }
  });
  people.forEach(p => {
    if (byId[p.father]) byId[p.father].gender ||= "M";
    if (byId[p.mother]) byId[p.mother].gender ||= "F";
  });
  people.forEach(p => { const s = byId[p.spouse]; if (s && s.gender && !p.gender) p.gender = s.gender === "M" ? "F" : "M"; });
  people.forEach(p => p.gender ||= "M");
  return {people, byId};
}

/* ---------- AUTH FLOW ---------- */
const $ = s => document.querySelector(s);
const gate = $("#gate");
function askPass(msg = ""){ if (FAMILY_PARAM) $("#gfamily").value = FAMILY_PARAM; $("#gmsg").textContent = msg; $("#gkey").value = ""; $("#gbtn").disabled = false; gate.classList.add("show"); setTimeout(() => $("#gkey").focus(), 50); }

async function load(family, key){
  family = family.trim();
  const familyCode = family.toLowerCase();
  if (!FAMILY_CODES.has(familyCode)){
    setStatus("");
    askPass("Family not set up yet. / 该家族尚未设置");
    return;
  }
  const endpoint = FAMILY_API_URLS[familyCode];
  if (!endpoint){
    setStatus("");
    askPass("This family's Apps Script link has not been added yet. / 尚未添加此家族的连接链接");
    return;
  }
  const storageKey = familyStorageKey(family);
  $("#gbtn").disabled = true; setStatus("Loading… 加载中");
  try {
    const res = await fetch(`${endpoint}?key=${encodeURIComponent(key)}`);
    const json = await res.json();
    if (!res.ok || !json || !["ok", "success"].includes(json.status) || !Array.isArray(json.data)){
      localStorage.removeItem(storageKey);
      askPass(json && json.status === "error"
        ? (json.message === "Unknown family" ? "Family not set up yet. / 该家族尚未设置" : "Invalid family name or passcode. / 家族名称或密码错误")
        : "The server returned an unexpected response. / 服务器返回了异常响应");
      return;
    }
    localStorage.setItem(storageKey, key);
    activeFamily = family;
    gate.classList.remove("show"); setStatus("");
    boot(normalize(json.data, familyCode));
  } catch (e) {
    askPass("Cannot reach the server. Check your connection and try again. / 无法连接服务器");
  }
}

$("#gform").addEventListener("submit", e => {
  e.preventDefault();
  const family = $("#gfamily").value.trim(), key = $("#gkey").value.trim(); if (!family || !key) return;
  load(family, key);
});
$("#logout").onclick = () => {
  localStorage.removeItem(familyStorageKey(activeFamily));
  selA = selB = null; role = "A";
  if (DEMO){ paint(); setStatus("Demo data — passcode cleared"); } else askPass();
};

/* ---------- GENERATIONS & LAYOUT ---------- */
function computeGenerations({people, byId}){
  const gen = {};
  const visiting = new Set();
  function generationOf(p){
    if (gen[p.id] !== undefined) return gen[p.id];
    if (p.placeholder) return gen[p.id] = -1;
    // Ignore only the edge that closes a cycle. This prevents corrupt parent
    // references from creating hundreds of phantom generations.
    if (visiting.has(p.id)) return null;
    visiting.add(p.id);
    const parentGenerations = [byId[p.father], byId[p.mother]]
      .filter(Boolean)
      .map(generationOf)
      .filter(Number.isFinite);
    visiting.delete(p.id);
    gen[p.id] = parentGenerations.length ? Math.max(...parentGenerations) + 1 : 0;
    return gen[p.id];
  }
  people.forEach(generationOf);
  // A married-in person with no parent records sits beside their spouse.
  for (let pass = 0; pass < people.length; pass++){
    let changed = false;
    people.forEach(p => {
      if (p.placeholder) return;
      const spouse = byId[p.spouse];
      if (!p.father && !p.mother && spouse && spouse.placeholder && gen[p.id] !== -1){
        gen[p.id] = -1;
        changed = true;
        return;
      }
      if (!p.father && !p.mother && spouse && (spouse.father || spouse.mother) && gen[p.id] !== gen[spouse.id]){
        gen[p.id] = gen[spouse.id];
        changed = true;
      }
    });
    if (!changed) break;
  }
  return gen;
}

const W = 220, H = 126;
async function layout({people, byId}){
  if (typeof ELK !== "function") throw new Error("The graph layout library did not load. Check your internet connection and reload.");
  const unions = new Map();
  const unionKey = ids => [...new Set(ids.filter(Boolean))].sort().join("|");
  const addUnion = (ids, children = []) => {
    const members = [...new Set(ids.filter(Boolean))];
    if (!members.length) return null;
    const key = unionKey(members);
    if (!unions.has(key)) unions.set(key, {key, members, children: []});
    const union = unions.get(key);
    children.forEach(child => { if (!union.children.some(p => p.id === child.id)) union.children.push(child); });
    return union;
  };
  people.forEach(child => { if (child.father || child.mother) addUnion([child.father, child.mother], [child]); });
  people.forEach(p => {
    const spouse = byId[p.spouse];
    if (spouse && p.id < spouse.id) addUnion([p.id, spouse.id]);
  });

  // Parent pairs from child records can be real couples even when the sheet
  // has no Spouse_ID for them (especially placeholder parents). Keep those
  // partners together in the node order so their shared child stem starts in
  // the gap between the two cards instead of passing through another family.
  const coParents = new Map();
  unions.forEach(union => {
    if (!union.children.length || union.members.length < 2) return;
    union.members.forEach(id => {
      if (!coParents.has(id)) coParents.set(id, new Set());
      union.members.forEach(otherId => { if (otherId !== id) coParents.get(id).add(otherId); });
    });
  });

  const unionNodes = new Map();
  let index = 0;
  const familyKey = p => {
    const parentIds = [p.father, p.mother].filter(Boolean).sort();
    if (parentIds.length) return `parents:${parentIds.join("|")}`;
    const spouse = byId[p.spouse];
    return spouse && !spouse.father && !spouse.mother
      ? `root:${[p.id, spouse.id].sort().join("|")}`
      : `root:${p.id}`;
  };
  const familyGroups = new Map();
  people.forEach(p => {
    const key = familyKey(p);
    if (!familyGroups.has(key)) familyGroups.set(key, []);
    familyGroups.get(key).push(p);
  });
  const orderedPeople = [], orderedIds = new Set();
  const addInOrder = p => { if (p && !orderedIds.has(p.id)) { orderedIds.add(p.id); orderedPeople.push(p); } };
  [...familyGroups.entries()].sort((a, b) => a[0].localeCompare(b[0])).forEach(([, members]) => {
    members.sort((a, b) => {
      if (a.birth && b.birth && a.birth !== b.birth) return a.birth - b.birth;
      return (a.rank ?? 99) - (b.rank ?? 99) || a.id.localeCompare(b.id);
    }).forEach(p => {
      addInOrder(p);
      const spouse = byId[p.spouse];
      // Do the same for a co-parent identified by a child's Father_ID and
      // Mother_ID when the sheet does not also have a Spouse_ID link.
      [...(coParents.get(p.id) || [])].sort().forEach(id => {
        const partner = byId[id];
        if (partner && !partner.father && !partner.mother) addInOrder(partner);
      });
      // Treat each couple as a unit in this row. The sibling records themselves
      // remain ordered by birth year; a spouse is kept next to their partner
      // even when that spouse also has their own parents in the sheet.
      if (spouse) addInOrder(spouse);
    });
  });
  // A placeholder parent may be discovered only after the real parent was
  // already placed by another relationship (for example, a divorced parent
  // with a new spouse/step-parent). Pull that placeholder next to its co-parent
  // so the children's shared parent stem has a clear junction.
  const moveAfter = (anchorId, movingId) => {
    const movingIndex = orderedPeople.findIndex(p => p.id === movingId);
    const anchorIndex = orderedPeople.findIndex(p => p.id === anchorId);
    if (movingIndex < 0 || anchorIndex < 0 || movingIndex === anchorIndex + 1) return;
    const [moving] = orderedPeople.splice(movingIndex, 1);
    const nextAnchorIndex = orderedPeople.findIndex(p => p.id === anchorId);
    orderedPeople.splice(nextAnchorIndex + 1, 0, moving);
  };
  unions.forEach(union => {
    if (!union.children.length || union.members.length !== 2) return;
    const [first, second] = union.members.map(id => byId[id]).filter(Boolean);
    if (!first || !second) return;
    const firstPlaceholder = first.placeholder, secondPlaceholder = second.placeholder;
    if (firstPlaceholder && !secondPlaceholder) moveAfter(second.id, first.id);
    else if (secondPlaceholder && !firstPlaceholder) moveAfter(first.id, second.id);
    else if (firstPlaceholder && secondPlaceholder) {
      const firstIndex = orderedPeople.findIndex(p => p.id === first.id);
      const secondIndex = orderedPeople.findIndex(p => p.id === second.id);
      if (firstIndex >= 0 && secondIndex >= 0) moveAfter(firstIndex < secondIndex ? first.id : second.id, firstIndex < secondIndex ? second.id : first.id);
    }
  });
  people.forEach(addInOrder);
  const children = orderedPeople.map(p => ({id: p.id, width: W, height: H}));
  unions.forEach(union => {
    const id = `union_${index++}`;
    union.nodeId = id;
    unionNodes.set(id, union);
    children.push({id, width: 10, height: 10});
  });
  const edges = [];
  unions.forEach(union => {
    union.members.forEach(parentId => edges.push({id: `e_${edges.length}`, sources: [parentId], targets: [union.nodeId]}));
    union.children.forEach(child => edges.push({id: `e_${edges.length}`, sources: [union.nodeId], targets: [child.id]}));
  });
  const graph = await new ELK().layout({
    id: "family",
    layoutOptions: {
      "elk.algorithm": "layered",
      "elk.direction": "DOWN",
      "elk.edgeRouting": "ORTHOGONAL",
      "elk.spacing.nodeNode": "74",
      "elk.layered.spacing.nodeNodeBetweenLayers": "94",
      "elk.layered.spacing.edgeNodeBetweenLayers": "30",
      "elk.layered.nodePlacement.strategy": "NETWORK_SIMPLEX",
      "elk.layered.crossingMinimization.strategy": "LAYER_SWEEP",
      "elk.layered.considerModelOrder.strategy": "NODES_AND_EDGES",
      "elk.layered.crossingMinimization.forceNodeModelOrder": "true"
    },
    children,
    edges
  });
  const pos = {}, unionPos = {};
  graph.children.forEach(node => {
    if (byId[node.id]) pos[node.id] = {x: node.x + 24, y: node.y + 32};
    else if (unionNodes.has(node.id)) unionPos[node.id] = {x: node.x + 24, y: node.y + 32};
  });
  // Keep the generation rows from ELK, then repack them using each branch's
  // descendant width. Equal-width cards alone are not enough: four sibling
  // couples with 2/4/2/4 children need enough room under each couple, or their
  // child buses overlap into one misleading line across the whole generation.
  const orderIndex = new Map(orderedPeople.map((p, i) => [p.id, i]));
  const rows = new Map();
  people.forEach(p => {
    if (!pos[p.id]) return;
    const y = Math.round(pos[p.id].y);
    if (!rows.has(y)) rows.set(y, []);
    rows.get(y).push(p);
  });
  const rowGap = 90, coupleGap = 28;
  const familyKeyForParents = parents => `parents:${parents.filter(Boolean).sort().join("|")}`;
  const birthFamilyKey = p => {
    const parents = [p.father, p.mother].filter(Boolean).sort();
    if (parents.length) return familyKeyForParents(parents);
    const spouse = byId[p.spouse];
    if (spouse) {
      const spouseParents = [spouse.father, spouse.mother].filter(Boolean).sort();
      if (spouseParents.length) return familyKeyForParents(spouseParents);
      return `root:${[p.id, spouse.id].sort().join("|")}`;
    }
    // A named parent and a placeholder co-parent must occupy the same family
    // block even when only one of them has their own parent records.
    const knownCoParent = [...(coParents.get(p.id) || [])].map(id => byId[id]).find(other => other && (other.father || other.mother));
    if (knownCoParent) return familyKeyForParents([knownCoParent.father, knownCoParent.mother]);
    const unknownCoParents = [...(coParents.get(p.id) || [])].sort();
    if (unknownCoParents.length) return `co-parents:${[p.id, ...unknownCoParents].sort().join("|")}`;
    return `root:${p.id}`;
  };
  const familyUnions = [...unions.values()].filter(union => union.children.length);
  const unionWidthCache = new Map(), unitWidthCache = new Map();
  const widthStack = new Set();
  const unitMembers = person => {
    const spouse = byId[person.spouse];
    if (!spouse || !pos[spouse.id] || Math.round(pos[spouse.id].y) !== Math.round(pos[person.id].y) || birthFamilyKey(spouse) !== birthFamilyKey(person)) return [person];
    return [person, spouse].sort((a, b) => {
      if (a.gender !== b.gender && a.gender && b.gender) return a.gender === "M" ? -1 : 1;
      return a.id.localeCompare(b.id);
    });
  };
  const unitWidth = person => {
    const members = unitMembers(person);
    const key = members.map(member => member.id).sort().join("|");
    if (unitWidthCache.has(key)) return unitWidthCache.get(key);
    if (widthStack.has(`unit:${key}`)) return members.length * W + (members.length > 1 ? coupleGap : 0);
    widthStack.add(`unit:${key}`);
    const childrenUnions = familyUnions.filter(union => union.members.some(id => members.some(member => member.id === id)));
    const branches = childrenUnions.map(unionWidth);
    const descendants = branches.reduce((sum, width, index) => sum + width + (index ? rowGap : 0), 0);
    const cardsWidth = members.length * W + (members.length > 1 ? coupleGap : 0);
    const width = Math.max(cardsWidth, descendants);
    widthStack.delete(`unit:${key}`);
    unitWidthCache.set(key, width);
    return width;
  };
  function unionWidth(union){
    if (unionWidthCache.has(union.key)) return unionWidthCache.get(union.key);
    if (widthStack.has(`union:${union.key}`)) return Math.max(W, union.children.length * (W + rowGap) - rowGap);
    widthStack.add(`union:${union.key}`);
    const orderedChildren = [...union.children].sort((a, b) => {
      if (a.birth && b.birth && a.birth !== b.birth) return a.birth - b.birth;
      return (a.rank ?? 99) - (b.rank ?? 99) || a.id.localeCompare(b.id);
    });
    const widths = orderedChildren.map(unitWidth);
    const width = Math.max(W, widths.reduce((sum, value, index) => sum + value + (index ? rowGap : 0), 0));
    widthStack.delete(`union:${union.key}`);
    unionWidthCache.set(union.key, width);
    return width;
  }
  [...rows.entries()].sort((a, b) => a[0] - b[0]).forEach(([, row]) => {
    // Pack each sibship as an independent branch. A child's reserved width is
    // the larger of the couple card width and that couple's descendant span.
    const groups = new Map();
    row.forEach(p => {
      const key = birthFamilyKey(p);
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(p);
    });
    const groupAnchorX = members => {
      const child = members.find(p => p.father || p.mother);
      if (child) {
        const parents = [byId[child.father], byId[child.mother]].filter(p => p && pos[p.id]);
        if (parents.length) return parents.reduce((sum, p) => sum + pos[p.id].x + W / 2, 0) / parents.length;
      }
      return members.reduce((sum, p) => sum + pos[p.id].x + W / 2, 0) / members.length;
    };
    const blocks = [...groups.values()].map(members => {
      members.sort((a, b) => (orderIndex.get(a.id) ?? Infinity) - (orderIndex.get(b.id) ?? Infinity));
      const units = [], assigned = new Set();
      members.forEach(person => {
        if (assigned.has(person.id)) return;
        const unit = unitMembers(person).filter(member => members.some(candidate => candidate.id === member.id));
        unit.forEach(member => assigned.add(member.id));
        units.push({members: unit, width: unitWidth(person), order: Math.min(...unit.map(member => orderIndex.get(member.id) ?? Infinity))});
      });
      units.sort((a, b) => a.order - b.order);
      const width = units.reduce((sum, unit, index) => sum + unit.width + (index ? rowGap : 0), 0);
      return {members, units, anchor: groupAnchorX(members), width};
    }).sort((a, b) => a.anchor - b.anchor);
    let cursor = -Infinity;
    blocks.forEach(block => {
      block.left = Math.max(block.anchor - block.width / 2, cursor + rowGap);
      cursor = block.left + block.width;
    });
    blocks.forEach(block => {
      let x = block.left;
      block.units.forEach(unit => {
        const cardWidth = unit.members.length * W + (unit.members.length > 1 ? coupleGap : 0);
        let cardX = x + (unit.width - cardWidth) / 2;
        unit.members.forEach(person => { pos[person.id].x = cardX; cardX += W + coupleGap; });
        x += unit.width + rowGap;
      });
    });
  });
  const minX = Math.min(24, ...Object.values(pos).map(p => p.x));
  Object.values(pos).forEach(p => { p.x += 24 - minX; });
  const laidOutRight = Math.max(0, ...Object.values(pos).map(p => p.x + W));
  const laidOutBottom = Math.max(0, ...Object.values(pos).map(p => p.y + H));
  return {pos, unionPos, totalW: Math.max(graph.width + 48, laidOutRight + 48), totalH: Math.max(graph.height + 64, laidOutBottom + 64), unionNodes};
}

/* ---------- KINSHIP ENGINE ---------- */
const WORD = {f:"爸爸", m:"妈妈", s:"儿子", d:"女儿", h:"丈夫", w:"妻子", ob:"哥哥", lb:"弟弟", os:"姐姐", ls:"妹妹"};

function buildGraph({people, byId}){
  const adj = Object.fromEntries(people.map(p => [p.id, []]));
  const add = (a, b, t) => adj[a].push({to: b, t});
  people.forEach(p => {
    [p.father, p.mother].forEach(pid => {
      const par = byId[pid]; if (!par) return;
      add(par.id, p.id, p.gender === "M" ? "s" : "d");      // parent → child
      add(p.id, par.id, par.gender === "M" ? "f" : "m");    // child → parent
    });
    const sp = byId[p.spouse];
    if (sp) add(p.id, sp.id, sp.gender === "M" ? "h" : "w"); // spouse → spouse
  });
  people.forEach(a => people.forEach(b => {                  // siblings: share a parent
    if (a.id === b.id) return;
    if (!((a.father && a.father === b.father) || (a.mother && a.mother === b.mother))) return;
    const bOlder = (a.rank != null && b.rank != null && a.rank !== b.rank) ? b.rank < a.rank : b.birth < a.birth;
    add(a.id, b.id, (bOlder ? "o" : "l") + (b.gender === "M" ? "b" : "s"));
  }));
  return adj;
}

function shortestChain(adj, from, to){
  if (from === to) return [];
  const prev = {[from]: null}, queue = [from];
  for (let i = 0; i < queue.length; i++){
    for (const e of adj[queue[i]]){
      if (e.to in prev) continue;
      prev[e.to] = {from: queue[i], t: e.t};
      if (e.to === to){ const c = []; let n = to; while (prev[n]) { c.unshift(prev[n].t); n = prev[n].from; } return c; }
      queue.push(e.to);
    }
  }
  return null;
}

function simplifyKinshipTitle(title, targetGender){
  if (typeof title !== "string") return title;
  if (/^(?:姨|舅|姑)甥(?:儿|子|女)?$/.test(title)) return targetGender === "F" ? "外甥女" : "外甥男";
  const plainParentSibling = title.replace(/^[大小]/, "");
  const parentSiblingTitles = {
    "舅": "舅舅", "舅舅": "舅舅", "舅父": "舅舅",
    "姨": "阿姨", "阿姨": "阿姨", "姨妈": "阿姨", "姨母": "阿姨",
    "姑": "姑姑", "姑姑": "姑姑", "姑妈": "姑姑", "姑母": "姑姑",
    "伯": "伯伯", "伯伯": "伯伯", "伯父": "伯伯",
    "叔": "叔叔", "叔叔": "叔叔", "叔父": "叔叔"
  };
  if (parentSiblingTitles[plainParentSibling]) return parentSiblingTitles[plainParentSibling];
  const inLawTitles = {
    "舅妈": "舅妈", "舅母": "舅妈",
    "姨丈": "姨丈", "姨夫": "姨丈",
    "伯母": "伯母",
    "婶婶": "婶婶", "婶母": "婶婶", "婶": "婶婶",
    "姑丈": "姑丈", "姑父": "姑丈"
  };
  if (inLawTitles[plainParentSibling]) return inLawTitles[plainParentSibling];
  const spouseNieceNephew = title.match(/^[妻夫]侄([儿子女])$/);
  if (spouseNieceNephew) return spouseNieceNephew[1] === "女" ? "侄女" : "侄儿";
  return title
    .replace(/^(?:姑|姨|舅)(表[哥姐弟妹])$/, "$1")
    .replace(/^姨([哥姐弟妹])$/, "表$1");
}

function isSiblingPair(a, b){
  return (a.father && a.father === b.father) || (a.mother && a.mother === b.mother);
}

function cousinKindFor(a, b, byId, generations){
  if (generations[a.id] !== generations[b.id] || isSiblingPair(a, b)) return null;
  const parentsA = [byId[a.father], byId[a.mother]].filter(Boolean);
  const parentsB = [byId[b.father], byId[b.mother]].filter(Boolean);
  for (const pa of parentsA) for (const pb of parentsB){
    if (pa.id === pb.id) continue;
    const parentSiblings = (pa.father && pa.father === pb.father) || (pa.mother && pa.mother === pb.mother);
    if (!parentSiblings) continue;
    const paternalUncles = pa.id === a.father && pb.id === b.father && pa.gender === "M" && pb.gender === "M";
    return paternalUncles ? "堂" : "表";
  }
  return null;
}

function ageBasedCousinTitle(caller, target, kind){
  if (!kind || !caller.birth || !target.birth || caller.birth === target.birth) return null;
  const older = target.birth < caller.birth;
  const suffix = target.gender === "F" ? (older ? "姐" : "妹") : (older ? "哥" : "弟");
  return kind + suffix;
}

function titlesFor(chain, aGender, bGender){
  const text = chain.map(t => WORD[t]).join("的"), sex = aGender === "M" ? 1 : 0;
  if (typeof relationship !== "function") return {text, error: "relationship.js did not load (check your connection)."};
  const pick = r => Array.isArray(r) ? r[0] : r;
  return {
    text,
    to: simplifyKinshipTitle(pick(relationship({text, sex})), bGender),
    back: simplifyKinshipTitle(pick(relationship({text, sex, reverse: true})), aGender)
  };
}

/* ---------- UI ---------- */
let data, gen, L, adj, viewPeople = [], activeFamily = FAMILY_PARAM, selA = null, selB = null, role = "A";
const stage = $("#stage"), vp = $("#viewport"), svg = $("#lines");
let view = {x: 0, y: 0, k: 1};
function setStatus(t){ $("#status").textContent = t; }

async function boot(d){
  data = d; viewPeople = d.people; selA = selB = null; role = "A";
  if (!data.people.length){ stage.querySelectorAll(".card,.tier-box,.tier-label").forEach(n => n.remove()); svg.innerHTML = ""; $("#banner").innerHTML = '<span class="err">No named people found in the data. 没有找到有姓名的人员</span>'; return; }
  gen = computeGenerations(data); adj = buildGraph(data);
  const largeFamily = data.people.length > 60;
  if (largeFamily) viewPeople = data.people.filter(p => p.placeholder || gen[p.id] <= 1);
  try { L = await layout(treeDataForView(), gen); render(); fit(); }
  catch (error) { setStatus(error.message); console.error(error); return; }
  if (largeFamily) setStatus("Overview: " + viewPeople.length + " of " + data.people.length + " people, first two generations. Select a person and focus their branch. / 家族总览：" + viewPeople.length + "/" + data.people.length + " 人；点选后可查看分支。");
  else if (DEMO) setStatus("Demo data — add a family Apps Script URL to connect live data");
}

function treeDataForView(){
  const visible = new Set(viewPeople.map(p => p.id));
  const people = viewPeople.map(p => ({
    ...p,
    father: visible.has(p.father) ? p.father : null,
    mother: visible.has(p.mother) ? p.mother : null,
    spouse: visible.has(p.spouse) ? p.spouse : null
  }));
  return {people, byId: Object.fromEntries(people.map(p => [p.id, p]))};
}

async function showTreeView(people, status){
  viewPeople = people;
  try {
    L = await layout(treeDataForView(), gen);
    render(); fit(); setStatus(status);
  } catch (error) { setStatus(error.message); console.error(error); }
}

function focusSelectedFamily(){
  if (!selA){ setStatus("Select Person A first. / 请先选择 Person A"); return; }
  const include = new Set([selA]);
  const add = id => { if (data.byId[id]) include.add(id); };
  const person = data.byId[selA];
  add(person.spouse);
  [person.father, person.mother].forEach(add);
  [person.father, person.mother].map(id => data.byId[id]).filter(Boolean).forEach(parent => add(parent.spouse));
  data.people.forEach(p => {
    if (p.id !== selA && ((person.father && p.father === person.father) || (person.mother && p.mother === person.mother))) {
      add(p.id); add(p.spouse);
    }
  });
  // Start descendant search from both the selected person and their spouse so
  // a spouse's children from a prior relationship are shown as stepchildren;
  // their own recorded biological parents are added with each child below.
  let frontier = [selA, person.spouse].filter(Boolean), visitedDescendants = new Set(frontier);
  while (frontier.length){
    const next = [];
    data.people.forEach(child => {
      if (visitedDescendants.has(child.id) || !frontier.some(id => child.father === id || child.mother === id)) return;
      add(child.id); add(child.spouse);
      // Keep both recorded parents visible for each descendant. This matters
      // for divorced families where the selected person's current spouse is
      // a step-parent and the children's other biological parent is different.
      add(child.father); add(child.mother);
      next.push(child.id); visitedDescendants.add(child.id);
    });
    frontier = next;
  }
  if (selB && !include.has(selB)) selB = null;
  showTreeView(data.people.filter(p => include.has(p.id)), `Focused family: ${include.size} people. / 家庭分支：${include.size} 人`);
}

function render(){
  stage.querySelectorAll(".card,.tier-box,.tier-label").forEach(n => n.remove());
  stage.style.width = L.totalW + "px"; stage.style.height = L.totalH + "px";
  svg.setAttribute("width", L.totalW); svg.setAttribute("height", L.totalH);
  let paths = "";
  const visibleIds = new Set(viewPeople.map(p => p.id));
  const renderedChildren = new Set(), renderedParentLinks = new Set(), renderedSpouses = new Set();
  const cards = viewPeople.map(p => ({id: p.id, ...L.pos[p.id], right: L.pos[p.id].x + W, bottom: L.pos[p.id].y + H}));
  const stepParentRoles = new Map();
  data.people.forEach(child => {
    const parents = [child.father, child.mother].filter(Boolean);
    if (parents.length < 2 || parents[0] === parents[1]) return;
    parents.forEach(parentId => {
      const parent = data.byId[parentId], spouse = parent && data.byId[parent.spouse];
      if (!spouse || parents.includes(spouse.id)) return;
      stepParentRoles.set(spouse.id, spouse.gender === "F" ? "Stepmother · 继母" : "Stepfather · 继父");
    });
  });
  let hiddenFamilySegments = 0, hiddenSpouseSegments = 0, familyPathCount = 0;
  const familyBuses = [];
  const hiddenFamilyDetails = [], hiddenSpouseDetails = [];
  let lastSegmentBlockers = [];
  const segmentIsCovered = (x1, y1, x2, y2, ignored) => {
    lastSegmentBlockers = cards.filter(card => {
      if (ignored.has(card.id)) return false;
      if (Math.abs(x1 - x2) < 0.5) {
        return x1 > card.x + 2 && x1 < card.right - 2 && Math.max(Math.min(y1, y2), card.y + 2) < Math.min(Math.max(y1, y2), card.bottom - 2);
      }
      if (Math.abs(y1 - y2) < 0.5) {
        return y1 > card.y + 2 && y1 < card.bottom - 2 && Math.max(Math.min(x1, x2), card.x + 2) < Math.min(Math.max(x1, x2), card.right - 2);
      }
      return false;
    }).map(card => card.id);
    return lastSegmentBlockers.length > 0;
  };
  const recordHiddenFamily = (type, union, rowChildren) => {
    hiddenFamilySegments++;
    hiddenFamilyDetails.push({type, parents: union.members, children: rowChildren.map(x => x.person.id), blockers: [...lastSegmentBlockers]});
  };
  const familyRoutes = [];
  L.unionNodes.forEach(union => {
    if (!union.children.length) return;
    const parents = union.members.map(id => ({id, p: L.pos[id]})).filter(x => x.p);
    const children = union.children.map(person => ({person, p: L.pos[person.id]})).filter(x => x.p);
    if (!parents.length || !children.length) return;
    const parentBottom = Math.max(...parents.map(x => x.p.y + H));
    const parentCenters = parents.map(x => x.p.x + W / 2);
    const childRows = new Map();
    children.forEach(child => {
      const row = Math.round(child.p.y);
      if (!childRows.has(row)) childRows.set(row, []);
      childRows.get(row).push(child);
    });
    childRows.forEach(rowChildren => {
      const childTop = Math.min(...rowChildren.map(x => x.p.y));
      const centers = rowChildren.map(x => x.p.x + W / 2).sort((a, b) => a - b);
      const parentCenters = parents.map(x => x.p.x + W / 2);
      familyRoutes.push({union, parents, rowChildren, parentBottom, childTop, parentCenters, centers,
        left: Math.min(...parentCenters, ...centers), right: Math.max(...parentCenters, ...centers),
        row: Math.round(childTop)});
    });
  });
  // A large family can contain several distinct parent unions whose horizontal
  // spans overlap (especially after divorce/remarriage). Put those buses on
  // separate levels in the generation gap so they stay visually separate.
  const routesByRow = new Map();
  familyRoutes.forEach(route => {
    if (!routesByRow.has(route.row)) routesByRow.set(route.row, []);
    routesByRow.get(route.row).push(route);
  });
  routesByRow.forEach(routes => {
    const lanes = [];
    routes.sort((a, b) => a.left - b.left || a.right - b.right);
    routes.forEach(route => {
      let lane = lanes.findIndex(lastRight => lastRight < route.left - 2);
      if (lane < 0) lane = lanes.length;
      lanes[lane] = route.right;
      route.lane = lane;
    });
    routes.forEach(route => { route.laneCount = lanes.length; });
  });
  familyRoutes.forEach(route => {
      const {union, parents, rowChildren, parentBottom, childTop, parentCenters, centers} = route;
      const gap = Math.max(1, childTop - parentBottom);
      // Keep lane spacing within the actual inter-generation gap. This remains
      // valid when a compact focused branch has less vertical room than a full tree.
      const busY = parentBottom + gap * (route.lane + 1) / (route.laneCount + 1);
      const rowChildIds = new Set(rowChildren.map(x => x.person.id));
      let d = "";
      // Use one vertical drop per recorded parent. This connects the couple
      // to the child bus without starting inside a card or relying on a
      // disconnected SVG subpath. For a single recorded parent this is just
      // that parent's own drop.
      parentCenters.forEach(cx => {
        const parent = parents.find(x => Math.abs(x.p.x + W / 2 - cx) < 0.5);
        const fromY = parent.p.y + H;
        if (segmentIsCovered(cx, fromY, cx, busY, new Set(union.members))) recordHiddenFamily("parent-stem", union, rowChildren);
        d += `M${cx},${fromY} V${busY}`;
      });
      const busLeft = Math.min(...parentCenters, ...centers);
      const busRight = Math.max(...parentCenters, ...centers);
      familyBuses.push({parents: union.members, children: rowChildren.map(x => x.person.id), y: busY, left: busLeft, right: busRight});
      if (segmentIsCovered(busLeft, busY, busRight, busY, new Set([...union.members, ...rowChildIds]))) recordHiddenFamily("sibling-bus", union, rowChildren);
      d += ` M${busLeft},${busY} H${busRight}`;
      if (centers.length === 1) {
        if (segmentIsCovered(centers[0], busY, centers[0], childTop, rowChildIds)) recordHiddenFamily("single-child-drop", union, rowChildren);
        d += ` M${centers[0]},${busY} V${childTop}`;
      } else {
        centers.forEach(cx => {
          const child = rowChildren.find(x => Math.abs(x.p.x + W / 2 - cx) < 0.5);
          if (child && segmentIsCovered(cx, busY, cx, childTop, new Set([child.person.id]))) recordHiddenFamily("child-drop", union, [child]);
          d += ` M${cx},${busY} V${childTop}`;
        });
      }
      paths += `<path d="${d}" fill="none" stroke="#526675" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>`;
      familyPathCount++;
      rowChildren.forEach(x => {
        renderedChildren.add(x.person.id);
        union.members.forEach(parentId => renderedParentLinks.add(`${parentId}|${x.person.id}`));
      });
  });
  viewPeople.forEach(p => {
    const s = data.byId[p.spouse]; if (!s || p.id > s.id) return;
    if (!visibleIds.has(s.id)) return;
    const a = L.pos[p.id], b = L.pos[s.id];
    if (!a || !b) return;
    const key = `${p.id}|${s.id}`;
    const sameRow = Math.abs(a.y - b.y) < 2;
    const l = a.x < b.x ? a : b, r = a.x < b.x ? b : a;
    const blocked = sameRow && viewPeople.some(other => {
      if (other.id === p.id || other.id === s.id) return false;
      const q = L.pos[other.id];
      return q && Math.abs(q.y - l.y) < 2 && q.x < r.x && q.x + W > l.x + W;
    });
    if (sameRow && !blocked && l.x + W <= r.x) {
      const l = a.x < b.x ? a : b, r = a.x < b.x ? b : a;
      if (segmentIsCovered(l.x + W, l.y + H / 2, r.x, r.y + H / 2, new Set([p.id, s.id]))) {
        hiddenSpouseSegments++; hiddenSpouseDetails.push({pair: [p.id, s.id], blockers: [...lastSegmentBlockers]});
      }
      paths += `<path d="M${l.x + W},${l.y + H / 2} H${r.x}" stroke="#10202c" stroke-width="2" stroke-dasharray="5 4"/>`;
    } else {
      const routeY = Math.max(a.y + H, b.y + H) + 14;
      const ax = a.x + W / 2, bx = b.x + W / 2;
      const ignorePair = new Set([p.id, s.id]);
      const hiddenRoute = segmentIsCovered(ax, a.y + H, ax, routeY, ignorePair) || segmentIsCovered(ax, routeY, bx, routeY, ignorePair) || segmentIsCovered(bx, routeY, bx, b.y + H, ignorePair);
      if (hiddenRoute) { hiddenSpouseSegments++; hiddenSpouseDetails.push({pair: [p.id, s.id], blockers: [...lastSegmentBlockers]}); }
      paths += `<path d="M${ax},${a.y + H} V${routeY} H${bx} V${b.y + H}" fill="none" stroke="#10202c" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
    renderedSpouses.add(key);
  });
  svg.innerHTML = paths;
  viewPeople.forEach(p => {
    const c = document.createElement("div"); c.className = "card"; c.dataset.id = p.id;
    c.style.left = L.pos[p.id].x + "px"; c.style.top = L.pos[p.id].y + "px";
    c.classList.add(p.gender === "M" ? "male" : p.gender === "F" ? "female" : "unknown");
    c.innerHTML = `<span class="n"></span><span class="y">${p.birth || ""}</span>`;
    c.querySelector(".n").textContent = p.name;
    if (stepParentRoles.has(p.id)) {
      const badge = document.createElement("span"); badge.className = "role"; badge.textContent = stepParentRoles.get(p.id);
      c.appendChild(badge);
    }
    stage.appendChild(c);
  });
  paint();
  const expectedChildren = viewPeople.filter(p => visibleIds.has(p.father) || visibleIds.has(p.mother));
  const expectedParentLinks = viewPeople.flatMap(p => [p.father, p.mother]
    .filter(parentId => parentId && visibleIds.has(parentId))
    .map(parentId => `${parentId}|${p.id}`));
  const spousePairs = viewPeople.filter(p => p.spouse && visibleIds.has(p.spouse) && p.id < p.spouse);
  const rows = new Map();
  viewPeople.forEach(p => { const y = Math.round(L.pos[p.id].y); rows.set(y, (rows.get(y) || 0) + 1); });
  const expectedConnectorPaths = familyPathCount + spousePairs.length;
  const connectorPaths = svg.querySelectorAll("path").length;
  const overlappingFamilyBuses = [];
  familyBuses.forEach((a, i) => familyBuses.slice(i + 1).forEach(b => {
    const overlap = Math.min(a.right, b.right) - Math.max(a.left, b.left);
    if (Math.abs(a.y - b.y) < 1 && overlap > 2) overlappingFamilyBuses.push({a: {parents: a.parents, children: a.children}, b: {parents: b.parents, children: b.children}, overlap});
  }));
  const audit = {
    cards: viewPeople.length,
    connectorPaths,
    expectedConnectorPaths,
    extraConnectorPaths: Math.max(0, connectorPaths - expectedConnectorPaths),
    missingConnectorPaths: Math.max(0, expectedConnectorPaths - connectorPaths),
    missingChildLinks: expectedChildren.filter(p => !renderedChildren.has(p.id)).length,
    expectedParentLinks: expectedParentLinks.length,
    renderedParentLinks: expectedParentLinks.filter(key => renderedParentLinks.has(key)).length,
    missingParentLinks: expectedParentLinks.filter(key => !renderedParentLinks.has(key)),
    hiddenFamilySegments,
    hiddenFamilyDetails,
    overlappingFamilyBuses,
    hiddenSpouseSegments,
    hiddenSpouseDetails,
    expectedChildLinks: expectedChildren.length,
    renderedChildLinks: renderedChildren.size,
    expectedSpouseLinks: spousePairs.length,
    renderedSpouseLinks: renderedSpouses.size,
    missingSpouseLinks: spousePairs.filter(p => !renderedSpouses.has(`${p.id}|${p.spouse}`)).length,
    rowCounts: [...rows.values()].sort((a, b) => a - b)
  };
  window.__treeAudit = audit;
  svg.setAttribute("data-audit", JSON.stringify(audit));
}

function paint(){
  stage.querySelectorAll(".card").forEach(c => {
    c.classList.toggle("A", c.dataset.id === selA); c.classList.toggle("B", c.dataset.id === selB);
    c.querySelector(".tag")?.remove();
    if (c.dataset.id === selA || c.dataset.id === selB){
      const t = document.createElement("span"); t.className = "tag"; t.textContent = c.dataset.id === selA ? "A" : "B"; c.appendChild(t);
    }
  });
  document.querySelectorAll(".pick button").forEach(b => b.classList.toggle("on", b.dataset.role === role));
  $("#nameA").textContent = selA && data ? data.byId[selA].name : "Tap a card";
  $("#nameB").textContent = selB && data ? data.byId[selB].name : "Tap a card";
  banner();
}

function banner(){
  const el = $("#banner");
  if (!data || !data.people.length) return;
  if (!selA || !selB){ el.textContent = !selA ? "Tap a card to choose Person A (Me). 请点选“我”。" : "Now tap Person B (the relative). 再点选亲戚。"; return; }
  const A = data.byId[selA], B = data.byId[selB], esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  if (selA === selB){ el.innerHTML = `<div class="row"><span>${esc(A.name)} calls ${esc(B.name)}:</span><span class="t">自己</span></div>`; return; }
  const chain = shortestChain(adj, selA, selB);
  if (!chain){ el.innerHTML = `<span class="err">No family link found between ${esc(A.name)} and ${esc(B.name)}.</span>`; return; }
  const r = titlesFor(chain, A.gender, B.gender);
  if (r.error){ el.innerHTML = `<span class="err">${r.error}</span><div class="chain">${r.text}</div>`; return; }
  const cousinKind = cousinKindFor(A, B, data.byId, gen);
  if (cousinKind){
    r.to = ageBasedCousinTitle(A, B, cousinKind) || r.to;
    r.back = ageBasedCousinTitle(B, A, cousinKind) || r.back;
  }
  el.innerHTML =
    `<div class="row"><span>${esc(A.name)} calls ${esc(B.name)}:</span><span class="t">${r.to || "（无标准称呼）"}</span></div>` +
    `<div class="row"><span>${esc(B.name)} calls ${esc(A.name)}:</span><span class="t">${r.back || "（无标准称呼）"}</span></div>` +
    `<div class="chain">${r.text}</div>`;
}

function choose(id){ if (role === "A"){ selA = id; role = "B"; } else selB = id; paint(); }
document.querySelectorAll(".pick button").forEach(b => b.onclick = () => { role = b.dataset.role; paint(); });
$("#clear").onclick = () => { selA = selB = null; role = "A"; paint(); };
$("#focus-tree").onclick = focusSelectedFamily;
$("#show-tree").onclick = () => showTreeView(data.people, `Whole family: ${data.people.length} people. / 完整家谱：${data.people.length} 人`);

/* ---------- PAN & ZOOM ---------- */
function apply(){ stage.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`; }
function zoomAt(cx, cy, f){
  const k = Math.min(2.5, Math.max(0.3, view.k * f)); f = k / view.k;
  view.x = cx - (cx - view.x) * f; view.y = cy - (cy - view.y) * f; view.k = k; apply();
}
function fit(){
  if (!L) return;
  const r = vp.getBoundingClientRect(), pad = 24;
  // Keep cards readable; let the user pan across wider family generations.
  view.k = Math.max(0.5, Math.min(1.2, (r.width - pad * 2) / L.totalW, (r.height - pad * 2) / L.totalH));
  view.x = (r.width - L.totalW * view.k) / 2; view.y = Math.max(pad, (r.height - L.totalH * view.k) / 2); apply();
}
const ptrs = new Map(); let moved = 0, lastDist = 0;
const dist = () => { const [a, b] = [...ptrs.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
vp.addEventListener("pointerdown", e => { ptrs.set(e.pointerId, {x: e.clientX, y: e.clientY}); if (ptrs.size === 1) moved = 0; if (ptrs.size === 2) lastDist = dist(); });
vp.addEventListener("pointermove", e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 1){
    moved += Math.abs(dx) + Math.abs(dy);
    if (matchMedia("(orientation:landscape) and (max-height:520px)").matches && Math.abs(dy) > Math.abs(dx)) { moved = 99; return; }
    if (moved > 6){ vp.classList.add("drag"); try { vp.setPointerCapture(e.pointerId); } catch (_) {} view.x += dx; view.y += dy; apply(); }
  } else if (ptrs.size === 2){
    moved = 99;
    const d = dist(), r = vp.getBoundingClientRect(), [a, b] = [...ptrs.values()];
    if (lastDist) zoomAt((a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top, d / lastDist);
    lastDist = d;
  }
});
const up = e => { ptrs.delete(e.pointerId); vp.classList.remove("drag"); lastDist = 0; };
vp.addEventListener("pointerup", up); vp.addEventListener("pointercancel", up);
vp.addEventListener("wheel", e => { e.preventDefault(); const r = vp.getBoundingClientRect(); zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0015)); }, {passive: false});
vp.addEventListener("click", e => { if (moved > 6) return; const c = e.target.closest(".card"); if (c) choose(c.dataset.id); });
const ctr = f => { const r = vp.getBoundingClientRect(); zoomAt(r.width / 2, r.height / 2, f); };
$("#zin").onclick = () => ctr(1.25); $("#zout").onclick = () => ctr(0.8); $("#zfit").onclick = fit;
addEventListener("resize", fit);

/* ---------- START ---------- */
(function start(){
  banner();
  if (DEMO) return boot(normalize(MOCK_ROWS));        // renders immediately with mock data
  const key = FAMILY_PARAM ? localStorage.getItem(familyStorageKey(FAMILY_PARAM)) : null;
  key ? load(FAMILY_PARAM, key) : askPass();
})();
</script>
